<!DOCTYPE html>
<html>
<head><title>Page 3: Registration Form</title></head>
<body>
    <h1>Registration (POST)</h1>
    <form action="page3.html" method="POST">
        <label>Email: <input type="email" name="email"></label><br>
        <label>Role: 
            <select name="role">
                <option value="user">User</option>
                <option value="admin">Admin</option>
            </select>
        </label><br>
        <button type="submit">Register</button>
    </form>
    <h2>Steps</h2>
    <ol>
        <li>Fill form</li>
        <li>Submit</li>
        <li>Verify email</li>
    </ol>
</body>
</html>
